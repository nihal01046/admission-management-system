{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password - College Admission System{% endblock %}

{% block public_content %}
<div class="auth-wrapper">
  <div class="card-custom shadow-lg p-4 p-md-5" style="max-width: 480px; width: 100%;">
    <div class="text-center mb-4">
      <div class="rounded-circle bg-light d-inline-flex align-items-center justify-content-center p-3 mb-3 text-primary">
        <i class="bi bi-key-fill fs-2"></i>
      </div>
      <h3 class="fw-bold" style="color: #0B3A6E;">Forgot Password?</h3>
      <p class="text-secondary small">Enter your registered email address to receive password recovery instructions.</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label-custom">Email Address</label>
        <div class="input-icon-group">
          <i class="bi bi-envelope"></i>
          <input type="email" name="email" class="form-control-custom" placeholder="Enter your registered email" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
        Send Reset Link
      </button>

      <div class="text-center small">
        <a href="{% url 'accounts:login' %}" class="text-decoration-none fw-semibold">
          <i class="bi bi-arrow-left"></i> Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
