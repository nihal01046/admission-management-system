{% extends 'base.html' %}
{% load static %}

{% block title %}403 - Access Denied{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="card-custom p-5">
      <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-inline-flex align-items-center justify-content-center p-3 mb-3 mx-auto" style="width: 80px; height: 80px;">
        <i class="bi bi-shield-x fs-1"></i>
      </div>
      <h1 class="display-3 fw-bold text-danger mb-2">403</h1>
      <h4 class="fw-bold text-dark mb-3">Access Forbidden</h4>
      <p class="text-secondary small mb-4">
        You do not have the required permissions to access this administrative section.
      </p>
      <a href="{% if user.is_authenticated %}{% url 'accounts:dashboard_redirect' %}{% else %}{% url 'accounts:login' %}{% endif %}" class="btn btn-primary-custom px-4 py-2">
        <i class="bi bi-arrow-left me-1"></i> Go Back
      </a>
    </div>
  </div>
</div>
{% endblock %}
