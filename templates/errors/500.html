{% extends 'base.html' %}
{% load static %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="card-custom p-5">
      <h1 class="display-3 fw-bold text-danger mb-2">500</h1>
      <h4 class="fw-bold text-dark mb-3">Internal Server Error</h4>
      <p class="text-secondary small mb-4">
        An unexpected error occurred while processing your request. Please try again or reach out to technical support.
      </p>
      <a href="{% if user.is_authenticated %}{% url 'accounts:dashboard_redirect' %}{% else %}{% url 'accounts:home' %}{% endif %}" class="btn btn-primary-custom px-4 py-2">
        <i class="bi bi-house me-1"></i> Return Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
