{% extends 'base.html' %}
{% load static %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="card-custom p-5">
      <h1 class="display-1 fw-bold text-primary mb-2">404</h1>
      <h4 class="fw-bold text-dark mb-3">Page Not Found</h4>
      <p class="text-secondary small mb-4">
        The page or resource you are looking for does not exist or may have been relocated.
      </p>
      <a href="{% if user.is_authenticated %}{% url 'accounts:dashboard_redirect' %}{% else %}{% url 'accounts:home' %}{% endif %}" class="btn btn-primary-custom px-4 py-2">
        <i class="bi bi-house me-1"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
